<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Rahim Nawaz| CV</title>

  <!-- Google Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      "darkMode": "class",
      "theme": {
        "extend": {
          "colors": {
            "on-background": "#e2e2e9",
            "surface-container": "#1e2025",
            "primary": "#8ed5ff",
            "outline": "#87929a",
            "surface": "#111318",
            "background": "#111318",
            "secondary": "#45dfa4"
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="bg-background font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container h-screen max-h-screen w-screen overflow-hidden m-0 p-0">
  
  <div class="flex flex-col h-screen max-h-screen w-full overflow-hidden justify-between p-3 md:p-5 box-border bg-[#111318] text-on-surface select-none">
    
    <!-- HEADER & NAVIGATION -->
    <header class="w-full flex items-center justify-between shrink-0 bg-[#1A1D24]/90 backdrop-blur-md px-4 py-2.5 rounded-xl shadow-lg border border-[#232732]">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-[#232732] flex items-center justify-center text-primary font-mono text-xs font-bold tracking-wider">AM</div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm tracking-tight text-white">RAHIM NAWAZ</span>
            <span class="hidden sm:inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-secondary/10 border border-secondary/20">
              <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
              <span class="text-[10px] text-secondary font-mono tracking-wider uppercase font-semibold">Available</span>
            </span>
          </div>
        </div>
      </div>

      <nav class="flex items-center gap-1 bg-[#111318]/80 p-1 rounded-lg border border-[#232732]/60" id="tab-nav">
        <button class="tab-btn active px-3 py-1.5 rounded-md text-xs font-medium transition-all text-white bg-[#232732] shadow-sm border border-[#33353a]" data-target="panel-profile">Profile</button>
        <button class="tab-btn px-3 py-1.5 rounded-md text-xs font-medium transition-all text-[#94A3B8] hover:text-white hover:bg-[#232732]/50" data-target="panel-education">Education</button>
        <button class="tab-btn px-3 py-1.5 rounded-md text-xs font-medium transition-all text-[#94A3B8] hover:text-white hover:bg-[#232732]/50" data-target="panel-skills">Skills</button>
        <button class="tab-btn px-3 py-1.5 rounded-md text-xs font-medium transition-all text-[#94A3B8] hover:text-white hover:bg-[#232732]/50" data-target="panel-hobbies">Hobbies</button>
        <button class="tab-btn px-3 py-1.5 rounded-md text-xs font-medium transition-all text-[#94A3B8] hover:text-white hover:bg-[#232732]/50" data-target="panel-credentials">Certificates</button>
      </nav>

      <div class="flex items-center gap-2">
        <a class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white text-[#111318] hover:bg-slate-200 transition-colors text-xs font-semibold tracking-wider uppercase shadow-sm" href="#resume">
          <span class="material-symbols-outlined text-[15px]">download</span>
          <span class="hidden sm:inline">CV</span>
        </a>
      </div>
    </header>

    <!-- MAIN DYNAMIC CONTENT AREA -->
    <main class="flex-1 min-h-0 w-full flex items-center justify-center p-2 relative overflow-hidden">
      
      <!-- 1. PROFILE SECTION -->
      <section class="tab-panel w-full max-w-4xl bg-[#1A1D24] border border-[#232732] rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all duration-300" id="panel-profile">
        <div class="absolute -top-32 -right-32 w-72 h-72 rounded-full bg-
